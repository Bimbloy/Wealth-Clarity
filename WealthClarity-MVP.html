<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wealth Clarity</title>
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }
    
    body { 
      font-family: Georgia, serif; 
      background: #0f0f0f; 
      color: #f0ece4;
      padding: 20px;
    }
    
    .container { 
      max-width: 680px; 
      margin: 0 auto; 
    }
    
    h1 { 
      font-size: 2rem; 
      margin-bottom: 0.5rem;
      text-align: center;
      margin-bottom: 2rem;
    }
    
    h2 { 
      font-size: 1.1rem; 
      margin-bottom: 1rem;
    }
    
    .card { 
      background: #141414; 
      border: 1px solid #1e1e1e; 
      border-radius: 12px; 
      padding: 1.5rem; 
      margin-bottom: 1.5rem;
    }
    
    label {
      font-size: 0.8rem;
      display: block;
      margin-bottom: 0.3rem;
      color: #999;
    }
    
    input, select { 
      width: 100%; 
      padding: 0.8rem; 
      margin-bottom: 0.8rem; 
      border-radius: 6px; 
      border: 1px solid #1e1e1e;
      background: #0a0a0a;
      color: #f0ece4;
      font-family: Georgia, serif;
      font-size: 1rem;
    }
    
    input:focus, select:focus {
      outline: none;
      border-color: #E8A87C;
      box-shadow: 0 0 0 3px rgba(232, 168, 124, 0.1);
    }
    
    .btn { 
      background: #E8A87C; 
      color: #0f0f0f; 
      border: none; 
      border-radius: 6px; 
      padding: 0.8rem 1.4rem; 
      font-weight: bold; 
      cursor: pointer;
      font-family: Georgia, serif;
      margin-right: 0.5rem;
      margin-bottom: 0.5rem;
    }
    
    .btn:hover { 
      opacity: 0.9; 
    }
    
    .btn.delete {
      background: #555;
    }
    
    .mood-btn {
      background: #333;
      color: #f0ece4;
      border: 2px solid #333;
      padding: 0.6rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
      font-family: Georgia, serif;
    }

    .mood-btn:hover {
      border-color: #E8A87C;
    }

    .mood-btn.selected {
      background: #E8A87C;
      color: #0f0f0f;
      border-color: #E8A87C;
    }
    
    .entry-item {
      padding: 1rem;
      border: 1px solid #1e1e1e;
      margin-bottom: 0.8rem;
      border-radius: 8px;
      background: #0a0a0a;
    }
    
    .entry-description {
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 0.3rem;
    }
    
    .entry-meta {
      font-size: 0.9rem;
      color: #999;
      margin-bottom: 0.8rem;
    }
    
    .entry-amount {
      color: #E8A87C;
      font-weight: bold;
      font-size: 1.2rem;
      margin-bottom: 0.8rem;
    }
    
    .entry-mood {
      font-size: 0.9rem;
      color: #999;
      margin-bottom: 0.8rem;
    }
    
    .edit-form {
      padding: 1rem;
      border: 2px solid #E8A87C;
      margin-bottom: 0.8rem;
      border-radius: 8px;
      background: #1a1a1a;
    }
    
    .edit-form h3 {
      margin-bottom: 1rem;
      font-size: 1rem;
    }
    
    .no-entries {
      text-align: center;
      padding: 2rem;
      color: #666;
      font-style: italic;
    }

    .mood-buttons-row {
      display: flex;
      gap: 10px;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Wealth Clarity</h1>
    
    <div class="card">
      <h2>Add Entry</h2>
      
      <label>Description</label>
      <input type="text" id="desc" placeholder="What did you spend on?">
      
      <label>Amount</label>
      <input type="number" id="amount" placeholder="Amount" min="0" step="0.01">
      
      <label>Category</label>
      <select id="category">
        <optgroup label="💰 Spending">
          <option value="food">🍽️ Food & Dining</option>
          <option value="transport">🚗 Transport</option>
          <option value="housing">🏠 Housing</option>
          <option value="health">💊 Health</option>
          <option value="education">📚 Education</option>
          <option value="childcare">👶 Childcare</option>
          <option value="entertainment">🎬 Entertainment</option>
          <option value="shopping">🛍️ Shopping</option>
          <option value="subscriptions">🔄 Subscriptions</option>
          <option value="utilities">⚡ Utilities</option>
          <option value="other">📦 Other</option>
        </optgroup>
        <optgroup label="🌱 Building Wealth">
          <option value="savings">🏦 Savings</option>
          <option value="investments">📈 Investments</option>
          <option value="emergency">🛡️ Emergency Fund</option>
          <option value="giving">🤝 Giving & Charity</option>
        </optgroup>
      </select>
      
      <label>Date</label>
      <input type="date" id="date">
      
      <label>How did this feel?</label>
      <div class="mood-buttons-row">
        <button type="button" class="mood-btn" data-mood="great" onclick="setMood('great', this)">🥰 Worth every penny</button>
        <button type="button" class="mood-btn" data-mood="good" onclick="setMood('good', this)">😊 Good call</button>
        <button type="button" class="mood-btn" data-mood="neutral" onclick="setMood('neutral', this)">😐 It is what it is</button>
        <button type="button" class="mood-btn" data-mood="regret" onclick="setMood('regret', this)">🤔 Second thoughts</button>
        <button type="button" class="mood-btn" data-mood="bad" onclick="setMood('bad', this)">🔄 Could do better</button>
      </div>
      <input type="hidden" id="mood" value="">
      
      <button class="btn" onclick="addEntry()">+ Add Entry</button>
    </div>

    <div class="card">
      <h2>Entries</h2>
      <div id="entries"></div>
    </div>
  </div>

  <script>
    // Category mapping
    const CATEGORIES = {
      food: { icon: '🍽️', label: 'Food & Dining' },
      transport: { icon: '🚗', label: 'Transport' },
      housing: { icon: '🏠', label: 'Housing' },
      health: { icon: '💊', label: 'Health' },
      education: { icon: '📚', label: 'Education' },
      childcare: { icon: '👶', label: 'Childcare' },
      entertainment: { icon: '🎬', label: 'Entertainment' },
      shopping: { icon: '🛍️', label: 'Shopping' },
      subscriptions: { icon: '🔄', label: 'Subscriptions' },
      utilities: { icon: '⚡', label: 'Utilities' },
      savings: { icon: '🏦', label: 'Savings' },
      investments: { icon: '📈', label: 'Investments' },
      emergency: { icon: '🛡️', label: 'Emergency Fund' },
      giving: { icon: '🤝', label: 'Giving & Charity' },
      other: { icon: '📦', label: 'Other' }
    };

    // Mood mapping
    const MOOD_NAMES = {
      great: '🥰 Worth every penny',
      good: '😊 Good call',
      neutral: '😐 It is what it is',
      regret: '🤔 Second thoughts',
      bad: '🔄 Could do better'
    };

    // Data storage
    let entries = JSON.parse(localStorage.getItem('el_e') || '[]');
    let editingId = null;

    // Set mood on add entry form
    function setMood(moodValue, buttonElement) {
      document.querySelectorAll('.mood-btn').forEach(btn => btn.classList.remove('selected'));
      buttonElement.classList.add('selected');
      document.getElementById('mood').value = moodValue;
    }

    // Set mood on edit form
    function setMoodEdit(entryId, moodValue, buttonElement) {
      document.querySelectorAll(`#moodButtons_${entryId} .mood-btn`).forEach(btn => btn.classList.remove('selected'));
      buttonElement.classList.add('selected');
      document.getElementById(`edit_mood_${entryId}`).value = moodValue;
    }

    // Add new entry
    function addEntry() {
      const desc = document.getElementById('desc').value.trim();
      const amount = parseFloat(document.getElementById('amount').value);
      const category = document.getElementById('category').value;
      const date = document.getElementById('date').value;
      const mood = document.getElementById('mood').value;

      if (!desc) {
        alert('Please enter a description');
        return;
      }

      if (!amount || amount <= 0) {
        alert('Please enter a valid amount');
        return;
      }

      if (!date) {
        alert('Please select a date');
        return;
      }

      if (!mood) {
        alert('Please select how you felt about this');
        return;
      }

      // Add to entries
      entries.unshift({ 
        id: Date.now(), 
        desc, 
        amount, 
        category, 
        date,
        mood
      });

      // Save to localStorage
      localStorage.setItem('el_e', JSON.stringify(entries));
      
      // Clear form
      document.getElementById('desc').value = '';
      document.getElementById('amount').value = '';
      document.getElementById('category').value = 'food';
      document.getElementById('date').valueAsDate = new Date();
      document.getElementById('mood').value = '';
      document.querySelectorAll('.mood-btn').forEach(btn => btn.classList.remove('selected'));
      
      // Re-render
      render();
    }

    // Start editing an entry
    function startEdit(id) {
      editingId = id;
      render();
      
      // Select the mood button after render
      setTimeout(() => {
        const entry = entries.find(e => e.id === id);
        if (entry && entry.mood) {
          const moodBtn = document.querySelector(`#moodButtons_${id} [data-mood="${entry.mood}"]`);
          if (moodBtn) {
            moodBtn.classList.add('selected');
          }
        }
      }, 0);
    }

    // Cancel editing
    function cancelEdit() {
      editingId = null;
      render();
    }

    // Save edited entry
    function saveEdit(id) {
      const newDesc = document.getElementById(`edit_desc_${id}`).value.trim();
      const newAmount = parseFloat(document.getElementById(`edit_amount_${id}`).value);
      const newCategory = document.getElementById(`edit_cat_${id}`).value;
      const newDate = document.getElementById(`edit_date_${id}`).value;
      const newMood = document.getElementById(`edit_mood_${id}`).value;

      if (!newDesc || !newAmount || !newDate) {
        alert('Please fill in all fields');
        return;
      }

      if (!newMood) {
        alert('Please select a mood');
        return;
      }

      // Update entry
      entries = entries.map(e => 
        e.id === id 
          ? { id, desc: newDesc, amount: newAmount, category: newCategory, date: newDate, mood: newMood }
          : e
      );

      // Save and re-render
      localStorage.setItem('el_e', JSON.stringify(entries));
      editingId = null;
      render();
    }

    // Delete an entry
    function deleteEntry(id) {
      if (confirm('Delete this entry?')) {
        entries = entries.filter(e => e.id !== id);
        localStorage.setItem('el_e', JSON.stringify(entries));
        render();
      }
    }

    // Render all entries
    function render() {
      const html = entries.map(e => {
        const cat = CATEGORIES[e.category];
        const moodLabel = MOOD_NAMES[e.mood] || '❓ Not rated';

        // Edit mode
        if (editingId === e.id) {
          return `
            <div class="edit-form">
              <h3>Editing: ${cat.icon} ${e.desc}</h3>
              
              <label>Description</label>
              <input type="text" id="edit_desc_${e.id}" value="${e.desc}">
              
              <label>Amount</label>
              <input type="number" id="edit_amount_${e.id}" value="${e.amount}">
              
              <label>Category</label>
              <select id="edit_cat_${e.id}">
                <optgroup label="💰 Spending">
                  <option value="food" ${e.category === 'food' ? 'selected' : ''}>🍽️ Food & Dining</option>
                  <option value="transport" ${e.category === 'transport' ? 'selected' : ''}>🚗 Transport</option>
                  <option value="housing" ${e.category === 'housing' ? 'selected' : ''}>🏠 Housing</option>
                  <option value="health" ${e.category === 'health' ? 'selected' : ''}>💊 Health</option>
                  <option value="education" ${e.category === 'education' ? 'selected' : ''}>📚 Education</option>
                  <option value="childcare" ${e.category === 'childcare' ? 'selected' : ''}>👶 Childcare</option>
                  <option value="entertainment" ${e.category === 'entertainment' ? 'selected' : ''}>🎬 Entertainment</option>
                  <option value="shopping" ${e.category === 'shopping' ? 'selected' : ''}>🛍️ Shopping</option>
                  <option value="subscriptions" ${e.category === 'subscriptions' ? 'selected' : ''}>🔄 Subscriptions</option>
                  <option value="utilities" ${e.category === 'utilities' ? 'selected' : ''}>⚡ Utilities</option>
                  <option value="other" ${e.category === 'other' ? 'selected' : ''}>📦 Other</option>
                </optgroup>
                <optgroup label="🌱 Building Wealth">
                  <option value="savings" ${e.category === 'savings' ? 'selected' : ''}>🏦 Savings</option>
                  <option value="investments" ${e.category === 'investments' ? 'selected' : ''}>📈 Investments</option>
                  <option value="emergency" ${e.category === 'emergency' ? 'selected' : ''}>🛡️ Emergency Fund</option>
                  <option value="giving" ${e.category === 'giving' ? 'selected' : ''}>🤝 Giving & Charity</option>
                </optgroup>
              </select>
              
              <label>Date</label>
              <input type="date" id="edit_date_${e.id}" value="${e.date}">
              
              <label>Mood</label>
              <div class="mood-buttons-row" id="moodButtons_${e.id}">
                <button type="button" class="mood-btn" data-mood="great" onclick="setMoodEdit(${e.id}, 'great', this)">🥰 Worth every penny</button>
                <button type="button" class="mood-btn" data-mood="good" onclick="setMoodEdit(${e.id}, 'good', this)">😊 Good call</button>
                <button type="button" class="mood-btn" data-mood="neutral" onclick="setMoodEdit(${e.id}, 'neutral', this)">😐 It is what it is</button>
                <button type="button" class="mood-btn" data-mood="regret" onclick="setMoodEdit(${e.id}, 'regret', this)">🤔 Second thoughts</button>
                <button type="button" class="mood-btn" data-mood="bad" onclick="setMoodEdit(${e.id}, 'bad', this)">🔄 Could do better</button>
              </div>
              <input type="hidden" id="edit_mood_${e.id}" value="${e.mood || ''}">
              
              <div style="margin-top: 1rem;">
                <button class="btn" onclick="saveEdit(${e.id})">✓ Save</button>
                <button class="btn" style="background: #666;" onclick="cancelEdit()">✕ Cancel</button>
              </div>
            </div>
          `;
        }

        // Normal view
        return `
          <div class="entry-item">
            <div class="entry-description">${cat.icon} ${e.desc}</div>
            <div class="entry-meta">${cat.label} • ${e.date}</div>
            <div class="entry-amount">$${e.amount.toFixed(2)}</div>
            <div class="entry-mood">${moodLabel}</div>
            <div>
              <button class="btn" onclick="startEdit(${e.id})">✎ Edit</button>
              <button class="btn delete" onclick="deleteEntry(${e.id})">✕ Delete</button>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('entries').innerHTML = html || '<div class="no-entries">No entries yet. Add one above!</div>';
    }

    // Initialize
    document.getElementById('date').valueAsDate = new Date();
    render();
  </script>
</body>
</html>
